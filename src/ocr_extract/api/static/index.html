<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>票据字段抽取</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #656d76; --line: #d0d7de; --accent: #0969da; --warn: #9a6700; --bad: #cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8d96a0; --line: #30363d; --accent: #4493f8; --warn: #d29922; --bad: #f85149; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-top: 16px; }
  form { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  select, button, input[type=file] { font: inherit; color: inherit; }
  select, button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
  button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  img { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; word-break: break-all; }
  th { color: var(--muted); font-weight: normal; width: 7.5em; }
  .null { color: var(--warn); }
  .err { color: var(--bad); }
  pre { margin: 0; white-space: pre-wrap; word-break: break-all; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>票据字段抽取</h1>
  <div class="muted">上传转账回单、发票或对账单图片(PNG/JPEG,≤5MB),抽取付款人、收款人、金额、日期、编号。仅用于合成样本演示。</div>

  <div class="card">
    <form id="form">
      <input type="file" id="file" name="file" accept="image/png,image/jpeg" required>
      <label>方案
        <select id="method" name="method">
          <option value="D" selected>D 融合路由(先 B,不确定时回退 C)</option>
          <option value="A">A OCR + 规则</option>
          <option value="B">B OCR + 大模型</option>
          <option value="C">C 多模态直接看图</option>
        </select>
      </label>
      <button id="submit" type="submit">识别</button>
      <span id="status" class="muted"></span>
    </form>
  </div>

  <div class="grid">
    <div class="card"><img id="preview" alt="" hidden><div id="nopreview" class="muted">选择图片后在这里预览</div></div>
    <div class="card">
      <table id="result"><tbody><tr><td class="muted">结果会显示在这里</td></tr></tbody></table>
    </div>
  </div>

  <div class="card"><div class="muted">原始 JSON</div><pre id="raw">-</pre></div>
</main>

<script>
const LABELS = { payer_name: "付款人", payee_name: "收款人", amount: "金额", date: "日期", serial_no: "编号" };
const $ = (id) => document.getElementById(id);

$("file").addEventListener("change", () => {
  const f = $("file").files[0];
  if (!f) return;
  $("preview").src = URL.createObjectURL(f);
  $("preview").hidden = false;
  $("nopreview").hidden = true;
});

function row(label, value, cls) {
  const tr = document.createElement("tr");
  const th = document.createElement("th");
  const td = document.createElement("td");
  th.textContent = label;
  td.textContent = value;  // 用 textContent,不用 innerHTML:结果里的文字不会被当成 HTML 执行
  if (cls) td.className = cls;
  tr.append(th, td);
  return tr;
}

function render(body) {
  const tb = document.createElement("tbody");
  for (const [k, label] of Object.entries(LABELS)) {
    const v = body.fields[k];
    const err = body.field_errors[k];
    tb.append(row(label, v ?? (err ? "null(" + err + ")" : "null(未找到)"), v == null ? (err ? "err" : "null") : ""));
  }
  tb.append(row("所用方案", body.method + (body.fallback ? "(已回退到多模态)" : "")));
  if (body.route_reasons.length) tb.append(row("回退原因", body.route_reasons.join("、")));
  tb.append(row("耗时", body.latency_s.toFixed(2) + " 秒(其中 OCR " + body.ocr_latency_s.toFixed(2) + " 秒)"));
  tb.append(row("token", "输入 " + body.tokens_in + " / 输出 " + body.tokens_out));
  $("result").replaceChildren(tb);
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = new FormData();
  data.append("file", $("file").files[0]);
  data.append("method", $("method").value);
  $("submit").disabled = true;
  $("status").textContent = "识别中…首次 OCR 在 CPU 上约需 20 秒";
  const t0 = performance.now();
  try {
    const resp = await fetch("/extract", { method: "POST", body: data });
    const body = await resp.json();
    $("raw").textContent = JSON.stringify(body, null, 2);
    if (!resp.ok) {
      $("result").replaceChildren(row("错误 " + resp.status, typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail), "err"));
      $("status").textContent = "";
      return;
    }
    render(body);
    $("status").textContent = "完成,页面总耗时 " + ((performance.now() - t0) / 1000).toFixed(1) + " 秒";
  } catch (err) {
    $("status").textContent = "请求失败:" + err;
  } finally {
    $("submit").disabled = false;
  }
});
</script>
</body>
</html>
